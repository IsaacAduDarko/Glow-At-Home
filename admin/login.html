<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glow At Home Admin Login</title>

<link rel="stylesheet" href="../css/admin.css">

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Glow At Home</h1>

        <p>Administrator Login</p>

        <form id="loginForm">

            <input
                id="email"
                type="email"
                placeholder="Email"
                required>

            <input
                id="password"
                type="password"
                placeholder="Password"
                required>

            <button type="submit">

                Login

            </button>

        </form>

        <p id="login-error"></p>

    </div>

</div>

<script type="module" src="../js/auth.js"></script>

</body>

</html>
